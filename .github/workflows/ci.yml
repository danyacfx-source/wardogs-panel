name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  panel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run panel tests
        env:
          WARDOGS_ENV: development
          WARDOGS_DISABLE_BACKGROUND: "1"
        run: python -m pytest tests/ -q

  bot-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check (embedded bot)
        run: python -m compileall -q app/bot
      - name: Import check (embedded bot)
        env:
          WARDOGS_ENV: development
          WARDOGS_DISABLE_BACKGROUND: "1"
        run: python -c "import app.bot.runner as runner; print('cogs:', len(runner.COGS))"

  render-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Precompiled Vue renders match their templates
        run: node tools/build-vue-render.mjs --check
