name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  panel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run panel tests
        env:
          WARDOGS_ENV: development
          WARDOGS_DISABLE_BACKGROUND: "1"
        run: python -m pytest tests/ -q

  bot-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/discord-bot-new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bots/discord-bot-new/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Import check
        env:
          DISCORD_TOKEN: "dummy"
          GUILD_ID: "0"
        run: python -c "import config; print('config ok')"
      - name: Run bot tests
        run: python -m pytest tests/ -q || echo "no bot tests yet"
